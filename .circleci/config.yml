version: 2.1

executors:
  node-postgres:
    docker:
      - image: cimg/node:22.22-browsers
      - image: cimg/postgres:17.10
        environment:
          POSTGRES_USER: agentpay
          POSTGRES_PASSWORD: agentpay
          POSTGRES_DB: agentpay
    environment:
      DATABASE_URL: postgresql://agentpay:agentpay@localhost:5432/agentpay?schema=public
      AUTH_SECRET: ci-auth-secret-that-is-at-least-thirty-two-characters
      KEY_ENCRYPTION_MASTER_KEY: ci-encryption-key-that-is-at-least-thirty-two-characters
      CRON_SECRET: ci-cron-secret-that-is-at-least-thirty-two-characters
      APP_ENV: test

jobs:
  verify:
    executor: node-postgres
    resource_class: large
    steps:
      - checkout
      - run:
          name: Validate CI and deployment shell syntax
          command: bash -n scripts/ci/*.sh scripts/render/*.sh
      - run:
          name: Pin repository npm version
          command: npm install --global npm@11.11.1
      - restore_cache:
          keys:
            - npm-v3-{{ checksum "package-lock.json" }}
            - npm-v3-
      - run:
          name: Materialize current dependency graph
          command: |
            npm install --package-lock-only --ignore-scripts --legacy-peer-deps
            npm ci --legacy-peer-deps
      - save_cache:
          key: npm-v3-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                echo "PostgreSQL is reachable."
                exit 0
              fi
              sleep 1
            done
            echo "PostgreSQL did not become reachable within the retry window." >&2
            exit 1
      - run:
          name: Deploy database migrations
          command: cd dashboard && npm run db:deploy
      - run:
          name: Verify canonical resources
          command: cd dashboard && npm run db:resources:check
      - run:
          name: Verify governance invariants
          command: cd dashboard && npm run verify:governance
      - run:
          name: Lint dashboard
          command: cd dashboard && npm run lint
      - run:
          name: Typecheck dashboard
          command: cd dashboard && npm run typecheck
      - run:
          name: Run dashboard unit tests
          command: cd dashboard && npm run test
      - run:
          name: Build dashboard
          command: cd dashboard && bash ../scripts/ci/build-dashboard.sh
      - run:
          name: Verify Hedera facilitator
          command: cd facilitator && npm run build && npm run typecheck && npm test
      - run:
          name: Verify Arc facilitator
          command: cd facilitator-arc && npm run build && npm run typecheck && npm test
      - run:
          name: Verify combined facilitator
          command: npm run build --workspace=@agentpay/hedera-facilitator && npm run build --workspace=@agentpay/arc-facilitator && npm run typecheck --workspace=@agentpay/combined-facilitator && npm test --workspace=@agentpay/combined-facilitator && npm run build --workspace=@agentpay/combined-facilitator
      - run:
          name: Verify resource server
          command: cd resource-server && npm run build && npm run typecheck && npm test
      - run:
          name: Verify card executor
          command: |
            cd card-executor
            npm install --ignore-scripts --no-audit --no-fund
            npm audit --omit=dev --audit-level=high
            node --check src/index.mjs
            node --check src/checkout.mjs
            node --check src/security.mjs
            node --check src/stripe.mjs
            npm test
      - run:
          name: Install Playwright Chromium
          command: cd dashboard && npx playwright install --with-deps chromium
      - run:
          name: Run browser smoke tests
          command: cd dashboard && npm run test:e2e

  security:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Dependency, SAST and secret scans
          command: bash scripts/ci/security.sh
      - store_artifacts:
          path: artifacts/security
          destination: security

  codeql:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - codeql-bundle-v2.25.5-linux64
      - run:
          name: CodeQL JavaScript/TypeScript analysis
          command: bash scripts/ci/codeql.sh
      - save_cache:
          key: codeql-bundle-v2.25.5-linux64
          paths:
            - ~/.cache/agentpay-codeql
      - store_artifacts:
          path: artifacts/security/codeql.sarif
          destination: security/codeql.sarif

  cardano-signer:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Verify isolated Cardano signer
          command: bash scripts/ci/cardano-signer.sh

  container-builds:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Build production service images
          command: bash scripts/ci/container-builds.sh

  lockfile-regenerate:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run:
          name: Pin repository npm version
          command: npm install --global npm@11.11.1
      - run:
          name: Regenerate package lock
          command: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - run:
          name: Report lockfile synchronization
          command: |
            if git diff --quiet -- package-lock.json; then
              echo "package-lock.json matches the manifests."
            else
              echo "package-lock.json regeneration produced changes; storing the canonical generated lock as a CI artifact."
              git diff --stat -- package-lock.json
            fi
      - run:
          name: Stage generated lock artifact
          command: |
            mkdir -p artifacts/lockfile
            cp package-lock.json artifacts/lockfile/package-lock.json
      - store_artifacts:
          path: artifacts/lockfile/package-lock.json
          destination: lockfile/package-lock.json

  release-gate:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run:
          name: Produce immutable CI release evidence
          command: bash scripts/ci/release-gate.sh
      - store_artifacts:
          path: artifacts/release
          destination: release

workflows:
  agentpay-production:
    jobs:
      - verify
      - security
      - codeql
      - cardano-signer
      - container-builds
      - lockfile-regenerate
      - release-gate:
          requires:
            - verify
            - security
            - codeql
            - cardano-signer
            - container-builds
