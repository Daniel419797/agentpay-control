version: 2.1

executors:
  node-postgres:
    docker:
      - image: cimg/node:22.22-browsers
      - image: cimg/postgres:17.10
        environment:
          POSTGRES_USER: agentpay
          POSTGRES_PASSWORD: agentpay
          POSTGRES_DB: agentpay
    environment:
      DATABASE_URL: postgresql://agentpay:agentpay@localhost:5432/agentpay?schema=public
      AUTH_SECRET: ci-auth-secret-that-is-at-least-thirty-two-characters
      KEY_ENCRYPTION_MASTER_KEY: ci-encryption-key-that-is-at-least-thirty-two-characters
      CRON_SECRET: ci-cron-secret-that-is-at-least-thirty-two-characters
      APP_ENV: test

jobs:
  verify:
    executor: node-postgres
    resource_class: large
    steps:
      - checkout
      - run:
          name: Validate CI and deployment shell syntax
          command: bash -n scripts/ci/*.sh scripts/render/*.sh
      - run:
          name: Pin repository npm version
          command: npm install --global npm@11.11.1
      - restore_cache:
          keys:
            - npm-v2-{{ checksum "package-lock.json" }}
            - npm-v2-
      - run:
          name: Install workspace dependencies
          command: npm ci
      - save_cache:
          key: npm-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                echo "PostgreSQL is reachable."
                exit 0
              fi
              sleep 1
            done
            echo "PostgreSQL did not become reachable within the retry window." >&2
            exit 1
      - run:
          name: Dashboard database and governance checks
          command: |
            cd dashboard
            npm run db:deploy
            npm run db:resources:check
            npm run verify:governance
      - run:
          name: Dashboard lint
          command: cd dashboard && npm run lint
      - run:
          name: Dashboard typecheck
          command: cd dashboard && npm run typecheck
      - run:
          name: Dashboard unit tests
          command: cd dashboard && npm run test
      - run:
          name: Dashboard production build
          command: cd dashboard && npm run build
      - run:
          name: Hedera facilitator verification
          command: |
            cd facilitator
            npm run build
            npm run typecheck
            npm test
      - run:
          name: Arc facilitator verification
          command: |
            cd facilitator-arc
            npm run build
            npm run typecheck
            npm test
      - run:
          name: Combined facilitator verification
          command: |
            npm run build --workspace=@agentpay/hedera-facilitator
            npm run build --workspace=@agentpay/arc-facilitator
            npm run typecheck --workspace=@agentpay/combined-facilitator
            npm test --workspace=@agentpay/combined-facilitator
            npm run build --workspace=@agentpay/combined-facilitator
      - run:
          name: Resource server verification
          command: |
            cd resource-server
            npm run build
            npm run typecheck
            npm test
      - run:
          name: Install Playwright Chromium
          command: |
            if [[ "${CI_SKIP_PLAYWRIGHT_INSTALL:-0}" != "1" ]]; then
              cd dashboard
              npx playwright install --with-deps chromium
            fi
      - run:
          name: Dashboard browser smoke tests
          command: cd dashboard && npm run test:e2e

  security:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Dependency, SAST and secret scans
          command: bash scripts/ci/security.sh
      - store_artifacts:
          path: artifacts/security
          destination: security

  codeql:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - codeql-bundle-v2.25.5-linux64
      - run:
          name: CodeQL JavaScript/TypeScript analysis
          command: bash scripts/ci/codeql.sh
      - save_cache:
          key: codeql-bundle-v2.25.5-linux64
          paths:
            - ~/.cache/agentpay-codeql
      - store_artifacts:
          path: artifacts/security/codeql.sarif
          destination: security/codeql.sarif

  cardano-signer:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Verify isolated Cardano signer
          command: bash scripts/ci/cardano-signer.sh

  container-builds:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Build Hedera facilitator image
          command: docker build -f facilitator/Dockerfile -t "agentpay/facilitator:${CIRCLE_SHA1}" .
      - run:
          name: Build Arc facilitator image
          command: docker build -f facilitator-arc/Dockerfile -t "agentpay/facilitator-arc:${CIRCLE_SHA1}" .
      - run:
          name: Build combined facilitator image
          command: docker build -f facilitator-combined/Dockerfile -t "agentpay/facilitator-combined:${CIRCLE_SHA1}" .
      - run:
          name: Build resource server image
          command: docker build -f resource-server/Dockerfile -t "agentpay/resource-server:${CIRCLE_SHA1}" .

  release-gate:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run:
          name: Produce immutable CI release evidence
          command: bash scripts/ci/release-gate.sh
      - store_artifacts:
          path: artifacts/release
          destination: release

workflows:
  agentpay-production:
    jobs:
      - verify
      - security
      - codeql
      - cardano-signer
      - container-builds
      - release-gate:
          requires:
            - verify
            - security
            - codeql
            - cardano-signer
            - container-builds
