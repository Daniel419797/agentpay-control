version: 2.1

executors:
  node-postgres:
    docker:
      - image: cimg/node:22.22-browsers
      - image: cimg/postgres:17.10
        environment:
          POSTGRES_USER: agentpay
          POSTGRES_PASSWORD: agentpay
          POSTGRES_DB: agentpay
    environment:
      DATABASE_URL: postgresql://agentpay:agentpay@localhost:5432/agentpay?schema=public
      AUTH_SECRET: ci-auth-secret-that-is-at-least-thirty-two-characters
      KEY_ENCRYPTION_MASTER_KEY: ci-encryption-key-that-is-at-least-thirty-two-characters
      CRON_SECRET: ci-cron-secret-that-is-at-least-thirty-two-characters
      APP_ENV: test

commands:
  install-workspace-dependencies:
    steps:
      - checkout
      - run:
          name: Pin repository npm version
          command: npm install --global npm@11.11.1
      - restore_cache:
          keys:
            - npm-v2-{{ checksum "package-lock.json" }}
            - npm-v2-
      - run:
          name: Install workspace dependencies
          command: npm ci

jobs:
  verify:
    executor: node-postgres
    resource_class: large
    steps:
      - checkout
      - run:
          name: Validate CI and deployment shell syntax
          command: bash -n scripts/ci/*.sh scripts/render/*.sh
      - run:
          name: Pin repository npm version
          command: npm install --global npm@11.11.1
      - restore_cache:
          keys:
            - npm-v2-{{ checksum "package-lock.json" }}
            - npm-v2-
      - run:
          name: Install workspace dependencies
          command: npm ci
      - save_cache:
          key: npm-v2-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                echo "PostgreSQL is reachable."
                exit 0
              fi
              sleep 1
            done
            echo "PostgreSQL did not become reachable within the retry window." >&2
            exit 1
      - run:
          name: Verify application and browser smoke tests
          command: bash scripts/ci/verify.sh

  diagnostic-dashboard-typecheck:
    executor: node-postgres
    resource_class: medium
    steps:
      - install-workspace-dependencies
      - run:
          name: Dashboard typecheck only
          command: cd dashboard && npm run typecheck

  diagnostic-dashboard-test:
    executor: node-postgres
    resource_class: large
    steps:
      - install-workspace-dependencies
      - run:
          name: Wait for PostgreSQL
          command: |
            for attempt in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then
                exit 0
              fi
              sleep 1
            done
            exit 1
      - run:
          name: Prepare dashboard test database
          command: cd dashboard && npm run db:deploy
      - run:
          name: Dashboard unit tests only
          command: cd dashboard && npm run test

  diagnostic-dashboard-build:
    executor: node-postgres
    resource_class: large
    steps:
      - install-workspace-dependencies
      - run:
          name: Dashboard build only
          command: cd dashboard && npm run build

  diagnostic-test-reconciliation:
    executor: node-postgres
    resource_class: medium
    steps:
      - install-workspace-dependencies
      - run:
          name: Reconciliation test only
          command: cd dashboard && npm run test -- src/domain/reconciliation-service.test.ts

  diagnostic-test-session:
    executor: node-postgres
    resource_class: medium
    steps:
      - install-workspace-dependencies
      - run:
          name: Session test only
          command: cd dashboard && npm run test -- src/lib/session.test.ts

  diagnostic-test-catalyst-libs:
    executor: node-postgres
    resource_class: medium
    steps:
      - install-workspace-dependencies
      - run:
          name: Touched Catalyst library tests only
          command: >-
            cd dashboard && npm run test --
            src/lib/cardano-assets.test.ts
            src/lib/catalyst-release.test.ts
            src/lib/masumi-payment.test.ts
            src/lib/masumi.test.ts
            src/lib/pyth.test.ts
            src/lib/veridian-keri.test.ts

  security:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Dependency, SAST and secret scans
          command: bash scripts/ci/security.sh
      - store_artifacts:
          path: artifacts/security
          destination: security

  codeql:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - codeql-bundle-v2.25.5-linux64
      - run:
          name: CodeQL JavaScript/TypeScript analysis
          command: bash scripts/ci/codeql.sh
      - save_cache:
          key: codeql-bundle-v2.25.5-linux64
          paths:
            - ~/.cache/agentpay-codeql
      - store_artifacts:
          path: artifacts/security/codeql.sarif
          destination: security/codeql.sarif

  cardano-signer:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Verify isolated Cardano signer
          command: bash scripts/ci/cardano-signer.sh

  container-builds:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Build production service images
          command: bash scripts/ci/container-builds.sh

  release-gate:
    docker:
      - image: cimg/node:22.22
    steps:
      - checkout
      - run:
          name: Produce immutable CI release evidence
          command: bash scripts/ci/release-gate.sh
      - store_artifacts:
          path: artifacts/release
          destination: release

workflows:
  agentpay-production:
    jobs:
      - verify
      - diagnostic-dashboard-typecheck
      - diagnostic-dashboard-test
      - diagnostic-dashboard-build
      - diagnostic-test-reconciliation
      - diagnostic-test-session
      - diagnostic-test-catalyst-libs
      - security
      - codeql
      - cardano-signer
      - container-builds
      - release-gate:
          requires:
            - verify
            - security
            - codeql
            - cardano-signer
            - container-builds
