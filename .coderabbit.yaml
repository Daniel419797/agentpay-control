# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "assertive"
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # PR #11 is review-only and targets this frozen pre-Catalyst checkpoint.
    # The default branch remains implicitly included by CodeRabbit.
    base_branches:
      - "review/catalyst-baseline"
    # Avoid burning review quota on every hardening commit. Trigger a final
    # full review manually once the release head is stabilized.
    auto_incremental_review: false
chat:
  auto_reply: true
