version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /facilitator
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /facilitator-arc
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /resource-server
    schedule:
      interval: weekly
