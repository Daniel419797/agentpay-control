version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: agent/fix-ci-security-cardano
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    allow:
      - dependency-name: "postcss"
    groups:
      lockfile-refresh:
        patterns:
          - "postcss"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /facilitator
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /facilitator-arc
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /facilitator-combined
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /resource-server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
