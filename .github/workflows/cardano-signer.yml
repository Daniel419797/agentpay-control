name: Cardano Signer

on:
  push:
    paths:
      - "cardano-signer/**"
      - ".github/workflows/cardano-signer.yml"
  pull_request:
    paths:
      - "cardano-signer/**"
      - ".github/workflows/cardano-signer.yml"

permissions:
  contents: read

jobs:
  verify-cardano-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Syntax check
        working-directory: cardano-signer
        run: npm run typecheck
      - name: Unit tests
        working-directory: cardano-signer
        run: npm test
      - name: Build production image
        run: docker build -f cardano-signer/Dockerfile -t agentpay/cardano-signer:${{ github.sha }} .
