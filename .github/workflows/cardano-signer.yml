name: Cardano Signer

on:
  push:
    paths:
      - "cardano-signer/**"
      - ".github/workflows/cardano-signer.yml"
  pull_request:
    paths:
      - "cardano-signer/**"
      - ".github/workflows/cardano-signer.yml"

permissions:
  contents: read

jobs:
  verify-cardano-signer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Syntax check
        working-directory: cardano-signer
        run: npm run typecheck
      - name: Unit tests
        working-directory: cardano-signer
        run: npm test
      - name: Build production image
        run: docker build -f cardano-signer/Dockerfile -t agentpay/cardano-signer:${{ github.sha }} .
