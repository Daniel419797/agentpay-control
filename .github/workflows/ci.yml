name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentpay
          POSTGRES_PASSWORD: agentpay
          POSTGRES_DB: agentpay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentpay -d agentpay"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://agentpay:agentpay@localhost:5432/agentpay?schema=public
      AUTH_SECRET: ci-auth-secret-that-is-at-least-thirty-two-characters
      KEY_ENCRYPTION_MASTER_KEY: ci-encryption-key-that-is-at-least-thirty-two-characters
      CRON_SECRET: ci-cron-secret-that-is-at-least-thirty-two-characters
      APP_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@11.11.1
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Apply database migrations
        working-directory: dashboard
        run: npm run db:deploy
      - name: Verify global payment identity isolation
        working-directory: dashboard
        run: npx tsx scripts/verify-payment-identity-isolation.ts
      - name: Verify resource endpoint invariants
        working-directory: dashboard
        run: npm run db:resources:check
      - name: Verify governance invariants
        working-directory: dashboard
        run: npm run verify:governance
      - name: Verify dashboard
        working-directory: dashboard
        run: npm run verify
      - name: Verify facilitator
        working-directory: facilitator
        run: npm run build && npm run typecheck && npm test
      - name: Verify Arc facilitator
        working-directory: facilitator-arc
        run: npm run build && npm run typecheck && npm test
      - name: Verify combined facilitator
        run: npm run build --workspace=@agentpay/hedera-facilitator && npm run build --workspace=@agentpay/arc-facilitator && npm run typecheck --workspace=@agentpay/combined-facilitator && npm test --workspace=@agentpay/combined-facilitator && npm run build --workspace=@agentpay/combined-facilitator
      - name: Verify Cardano signer
        working-directory: cardano-signer
        run: node --test server.test.mjs
      - name: Verify resource server
        working-directory: resource-server
        run: npm run build && npm run typecheck && npm test
      - name: Install Playwright browser
        working-directory: dashboard
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        working-directory: dashboard
        run: npm run test:e2e

  container-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - facilitator
          - facilitator-arc
          - facilitator-combined
          - resource-server
          - cardano-signer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build ${{ matrix.service }} production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: agentpay/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
