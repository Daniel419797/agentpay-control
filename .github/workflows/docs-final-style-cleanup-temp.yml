name: Final documentation style cleanup

on:
  push:
    branches:
      - docs/final-style-cleanup-2026-08-22

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/final-style-cleanup-2026-08-22
          fetch-depth: 0

      - name: Remove update boilerplate and normalize documentation style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = []
          for p in Path('.').rglob('*.md'):
              if '.git' in p.parts or ('security' in p.parts and 'reviews' in p.parts):
                  continue
              files.append(p)

          meta_headings = (
              'Revision note',
              'Revision summary',
              'Update summary',
              'Update provenance',
              'Documentation provenance',
          )

          section_re = re.compile(
              r'\n## (?:' + '|'.join(re.escape(x) for x in meta_headings) + r')\n.*?(?=\n## |\Z)',
              re.DOTALL,
          )
          note_re = re.compile(
              r'^> \*\*(?:Reason for update|Why this document was updated|Why this document was updated|Why this document was updated):\*\*[^\n]*\n(?:>[^\n]*\n)*\n?',
              re.MULTILINE,
          )

          for p in files:
              text = p.read_text(encoding='utf-8')
              text = note_re.sub('', text)
              text = section_re.sub('\n', text)
              text = text.replace('—', '-').replace('–', '-')
              text = text.replace('“', '"').replace('”', '"')
              text = text.replace('’', "'").replace('‘', "'")
              text = re.sub(r'\n{3,}', '\n\n', text)
              p.write_text(text, encoding='utf-8')

          forbidden = [
              '## Revision note',
              '## Revision summary',
              '## Update summary',
              '## Update provenance',
              '## Documentation provenance',
              '> **Reason for update:**',
              '> **Why this document was updated:**',
              'I originally built AgentPay',
              'I am **Daniel Praise',
              'For Catalyst I',
              'I currently state',
              'I currently describe',
              'When I present',
          ]
          problems = []
          for p in files:
              text = p.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      problems.append(f'{p}: contains {token!r}')
              for ch in ('—', '–', '“', '”', '’', '‘'):
                  if ch in text:
                      problems.append(f'{p}: contains typography {ch!r}')

          if problems:
              print('\n'.join(problems))
              raise SystemExit(f'Found {len(problems)} remaining documentation style issues')
          PY

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/docs-final-style-cleanup-temp.yml
          if git diff --quiet; then
            echo "No cleanup changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove documentation update boilerplate"
          git push origin HEAD:docs/final-style-cleanup-2026-08-22
