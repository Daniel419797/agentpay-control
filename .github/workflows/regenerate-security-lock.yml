name: Regenerate security lockfile

on:
  push:
    branches:
      - agent/fix-ci-security-cardano
    paths:
      - package.json
      - dashboard/package.json
      - facilitator/package.json
      - facilitator-arc/package.json
      - facilitator-combined/package.json
      - resource-server/package.json
      - .github/workflows/regenerate-security-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-ci-security-cardano

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Pin repository npm version
        run: npm install --global npm@11.11.1

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate security lockfile"
          git push origin HEAD:agent/fix-ci-security-cardano
