# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:

  - type: web
    name: agentpay-cardano-signer-preprod
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: cardano-signer/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: CARDANO_NETWORK
        value: preprod
      - key: CARDANO_PAYER_ADDRESS
        sync: false
      - key: CARDANO_USDCX_ASSET_ID
        sync: false
      - key: CARDANO_BLOCKFROST_URL
        value: https://cardano-preprod.blockfrost.io/api/v0
      - key: CARDANO_BLOCKFROST_PROJECT_ID
        sync: false
      # Gateway capability generated and kept by Render. The facilitator reads
      # this exact value through fromService instead of copying it manually.
      - key: CARDANO_SIGNER_API_KEY
        generateValue: true
      - key: CARDANO_PAYMENT_PUBLIC_KEY_HEX
        sync: false
      # Actual Ed25519 custody remains outside this web service. It receives
      # only a 32-byte transaction-body hash and returns a signature.
      - key: CARDANO_ED25519_SIGNER_URL
        sync: false
      - key: CARDANO_ED25519_SIGNER_API_KEY
        sync: false
      - key: CARDANO_MIN_OUTPUT_LOVELACE
        value: "1000000"
      - key: CARDANO_TOKEN_OUTPUT_LOVELACE
        value: "2000000"
      - key: CARDANO_MIN_CHANGE_LOVELACE
        value: "2000000"
      - key: CARDANO_MAX_INPUTS
        value: "20"

  - type: web
    name: agentpay-facilitator
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: facilitator-combined/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: HEDERA_BASE_PATH
        value: /hedera
      - key: ARC_BASE_PATH
        value: /arc
      - key: CARDANO_BASE_PATH
        value: /cardano
      - key: HEDERA_NETWORK
        value: testnet
      - key: HEDERA_OPERATOR_ID
        sync: false
      - key: HEDERA_OPERATOR_KEY
        sync: false
      - key: HEDERA_OPERATOR_KEY_TYPE
        sync: false
      - key: HEDERA_PAYER_ID
        sync: false
      - key: HEDERA_PAYER_KEY
        sync: false
      - key: HEDERA_PAYER_KEY_TYPE
        sync: false
      - key: ARC_PAYER_PRIVATE_KEY
        sync: false
      - key: ARC_RELAYER_PRIVATE_KEY
        sync: false
      - key: ARC_CONTRACT_EXECUTION_PRIVATE_KEY
        sync: false
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: ARC_PROVIDER_ADDRESS
        sync: false
      - key: CARDANO_NETWORK
        value: preprod
      - key: CARDANO_PAYER_ADDRESS
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_PAYER_ADDRESS
      - key: CARDANO_USDCX_ASSET_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_USDCX_ASSET_ID
      - key: CARDANO_BLOCKFROST_URL
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_BLOCKFROST_URL
      - key: CARDANO_BLOCKFROST_PROJECT_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_BLOCKFROST_PROJECT_ID
      - key: CARDANO_SIGNER_URL
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: RENDER_EXTERNAL_URL
      - key: CARDANO_SIGNER_API_KEY
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_SIGNER_API_KEY
      # Dashboard HTTPS claim-store endpoint and matching capability are still
      # supplied explicitly because the dashboard is deployed outside Render.
      - key: CARDANO_SETTLEMENT_STORE_URL
        sync: false
      - key: CARDANO_SETTLEMENT_STORE_API_KEY
        sync: false
      - key: HEDERA_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: HEDERA_SETTLEMENT_API_KEY
        generateValue: true
      - key: HEDERA_CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: ARC_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: ARC_SETTLEMENT_API_KEY
        generateValue: true
      - key: ARC_CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: CARDANO_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: CARDANO_SETTLEMENT_API_KEY
        generateValue: true
      - key: CONTRACT_ALLOWLIST_JSON
        value: "[]"

  - type: web
    name: agentpay-resource-server
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: resource-server/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLED_NETWORKS
        value: hedera:testnet,eip155:5042002,cardano:preprod
      # Fail closed: Cardano USDCx is not advertised merely because source support exists.
      # Flip this to true only after the shared asset unit and funded canary are verified.
      - key: CARDANO_USDCX_ENABLED
        value: "false"
      - key: FACILITATOR_URL
        sync: false
      - key: ARC_FACILITATOR_URL
        sync: false
      - key: CARDANO_PREPROD_FACILITATOR_URL
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: RENDER_EXTERNAL_URL
      - key: FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: HEDERA_SETTLEMENT_API_KEY
      - key: ARC_FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: ARC_SETTLEMENT_API_KEY
      - key: CARDANO_PREPROD_FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: CARDANO_SETTLEMENT_API_KEY
      - key: PROVIDER_ACCOUNT_ID
        sync: false
      - key: USDC_TOKEN_ID
        sync: false
      - key: FACILITATOR_FEE_PAYER_ID
        sync: false
      - key: ARC_PROVIDER_ADDRESS
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: ARC_PROVIDER_ADDRESS
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: CARDANO_PREPROD_PROVIDER_ADDRESS
        sync: false
      - key: CARDANO_PREPROD_USDCX_ASSET_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_USDCX_ASSET_ID
      - key: CARDANO_USDCX_RESOURCE_PRICE_ATOMIC
        value: "1000000"
