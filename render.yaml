# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: off

services:

  - type: web
    name: agentpay-cardano-signer-preprod
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: cardano-signer/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: CARDANO_NETWORK
        value: preprod
      - key: CARDANO_PAYER_ADDRESS
        sync: false
      - key: CARDANO_USDCX_ASSET_ID
        sync: false
      - key: CARDANO_BLOCKFROST_URL
        value: https://cardano-preprod.blockfrost.io/api/v0
      - key: CARDANO_BLOCKFROST_PROJECT_ID
        sync: false
      # Gateway capability generated and kept by Render. The facilitator reads
      # this exact value through fromService instead of copying it manually.
      - key: CARDANO_SIGNER_API_KEY
        generateValue: true
      - key: CARDANO_PAYMENT_PUBLIC_KEY_HEX
        sync: false
      # Actual Ed25519 custody remains outside this web service. It receives
      # only a 32-byte transaction-body hash and returns a signature.
      - key: CARDANO_ED25519_SIGNER_URL
        sync: false
      - key: CARDANO_ED25519_SIGNER_API_KEY
        sync: false
      - key: CARDANO_MIN_OUTPUT_LOVELACE
        value: "1000000"
      - key: CARDANO_TOKEN_OUTPUT_LOVELACE
        value: "2000000"
      - key: CARDANO_MIN_CHANGE_LOVELACE
        value: "2000000"
      - key: CARDANO_MAX_INPUTS
        value: "20"

  - type: web
    name: agentpay-facilitator
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: facilitator-combined/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: HEDERA_BASE_PATH
        value: /hedera
      - key: ARC_BASE_PATH
        value: /arc
      - key: CARDANO_BASE_PATH
        value: /cardano
      - key: HEDERA_NETWORK
        value: testnet
      - key: HEDERA_OPERATOR_ID
        sync: false
      - key: HEDERA_OPERATOR_KEY
        sync: false
      - key: HEDERA_OPERATOR_KEY_TYPE
        sync: false
      - key: HEDERA_PAYER_ID
        sync: false
      - key: HEDERA_PAYER_KEY
        sync: false
      - key: HEDERA_PAYER_KEY_TYPE
        sync: false
      - key: ARC_PAYER_PRIVATE_KEY
        sync: false
      - key: ARC_RELAYER_PRIVATE_KEY
        sync: false
      - key: ARC_CONTRACT_EXECUTION_PRIVATE_KEY
        sync: false
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: ARC_PROVIDER_ADDRESS
        sync: false
      - key: CARDANO_NETWORK
        value: preprod
      - key: CARDANO_PAYER_ADDRESS
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_PAYER_ADDRESS
      - key: CARDANO_USDCX_ASSET_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_USDCX_ASSET_ID
      - key: CARDANO_BLOCKFROST_URL
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_BLOCKFROST_URL
      - key: CARDANO_BLOCKFROST_PROJECT_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_BLOCKFROST_PROJECT_ID
      - key: CARDANO_SIGNER_URL
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: RENDER_EXTERNAL_URL
      - key: CARDANO_SIGNER_API_KEY
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_SIGNER_API_KEY
      # Exact endpoint required by the Cardano settlement claim protocol:
      # https://<dashboard-host>/api/v1/internal/cardano-settlement-claims
      # Render cannot concatenate a service URL and path in Blueprint YAML, so
      # this one URL is supplied during Blueprint setup and validated as HTTPS
      # by the facilitator in production.
      - key: CARDANO_SETTLEMENT_STORE_URL
        sync: false
      # Generate the capability once at the control-plane boundary; the
      # dashboard reads this exact secret through fromService below.
      - key: CARDANO_SETTLEMENT_STORE_API_KEY
        generateValue: true
      - key: HEDERA_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: HEDERA_SETTLEMENT_API_KEY
        generateValue: true
      - key: HEDERA_CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: ARC_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: ARC_SETTLEMENT_API_KEY
        generateValue: true
      - key: ARC_CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: CARDANO_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: CARDANO_SETTLEMENT_API_KEY
        generateValue: true
      - key: CONTRACT_ALLOWLIST_JSON
        value: "[]"

  - type: web
    name: agentpay-hedera-mainnet-facilitator
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: facilitator/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: HEDERA_NETWORK
        value: mainnet
      - key: HEDERA_OPERATOR_ID
        sync: false
      - key: HEDERA_OPERATOR_KEY
        sync: false
      - key: HEDERA_OPERATOR_KEY_TYPE
        sync: false
      - key: HEDERA_PAYER_ID
        sync: false
      - key: HEDERA_PAYER_KEY
        sync: false
      - key: HEDERA_PAYER_KEY_TYPE
        sync: false
      - key: MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: SETTLEMENT_API_KEY
        generateValue: true
      - key: CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: CONTRACT_ALLOWLIST_JSON
        value: "[]"

  - type: web
    name: agentpay-cardano-signer-mainnet
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: cardano-signer/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: CARDANO_NETWORK
        value: mainnet
      - key: CARDANO_PAYER_ADDRESS
        sync: false
      - key: CARDANO_USDCX_ASSET_ID
        sync: false
      - key: CARDANO_BLOCKFROST_URL
        value: https://cardano-mainnet.blockfrost.io/api/v0
      - key: CARDANO_BLOCKFROST_PROJECT_ID
        sync: false
      - key: CARDANO_SIGNER_API_KEY
        generateValue: true
      - key: CARDANO_PAYMENT_PUBLIC_KEY_HEX
        sync: false
      - key: CARDANO_ED25519_SIGNER_URL
        sync: false
      - key: CARDANO_ED25519_SIGNER_API_KEY
        sync: false
      - key: CARDANO_MIN_OUTPUT_LOVELACE
        value: "1000000"
      - key: CARDANO_TOKEN_OUTPUT_LOVELACE
        value: "2000000"
      - key: CARDANO_MIN_CHANGE_LOVELACE
        value: "2000000"
      - key: CARDANO_MAX_INPUTS
        value: "20"

  - type: web
    name: agentpay-cardano-mainnet-facilitator
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: facilitator-combined/Dockerfile.cardano
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: CARDANO_NETWORK
        value: mainnet
      - key: CARDANO_PAYER_ADDRESS
        fromService:
          type: web
          name: agentpay-cardano-signer-mainnet
          envVarKey: CARDANO_PAYER_ADDRESS
      - key: CARDANO_USDCX_ASSET_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-mainnet
          envVarKey: CARDANO_USDCX_ASSET_ID
      - key: CARDANO_BLOCKFROST_URL
        fromService:
          type: web
          name: agentpay-cardano-signer-mainnet
          envVarKey: CARDANO_BLOCKFROST_URL
      - key: CARDANO_BLOCKFROST_PROJECT_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-mainnet
          envVarKey: CARDANO_BLOCKFROST_PROJECT_ID
      - key: CARDANO_SIGNER_URL
        fromService:
          type: web
          name: agentpay-cardano-signer-mainnet
          envVarKey: RENDER_EXTERNAL_URL
      - key: CARDANO_SIGNER_API_KEY
        fromService:
          type: web
          name: agentpay-cardano-signer-mainnet
          envVarKey: CARDANO_SIGNER_API_KEY
      - key: CARDANO_SETTLEMENT_STORE_URL
        sync: false
      - key: CARDANO_SETTLEMENT_STORE_API_KEY
        generateValue: true
      - key: MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: SETTLEMENT_API_KEY
        generateValue: true
      - key: CARDANO_MAX_FEE_LOVELACE
        value: "1000000"
      - key: CARDANO_CONFIRMATION_TIMEOUT_MS
        value: "120000"
      - key: CARDANO_CONFIRMATION_POLL_MS
        value: "3000"

  - type: web
    name: agentpay-resource-server
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: resource-server/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: ENABLED_NETWORKS
        value: hedera:testnet,eip155:5042002,cardano:preprod
      # Fail closed: Cardano USDCx is not advertised merely because source support exists.
      # Flip this to true only after the shared asset unit and funded canary are verified.
      - key: CARDANO_USDCX_ENABLED
        value: "false"
      # The combined facilitator's root dispatcher selects the namespaced rail
      # from the exact network binding in the x402 payload/requirement pair.
      - key: FACILITATOR_URL
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: RENDER_EXTERNAL_URL
      - key: ARC_FACILITATOR_URL
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: RENDER_EXTERNAL_URL
      - key: CARDANO_PREPROD_FACILITATOR_URL
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: RENDER_EXTERNAL_URL
      - key: FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: HEDERA_SETTLEMENT_API_KEY
      - key: ARC_FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: ARC_SETTLEMENT_API_KEY
      - key: CARDANO_PREPROD_FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: CARDANO_SETTLEMENT_API_KEY
      - key: PROVIDER_ACCOUNT_ID
        sync: false
      - key: USDC_TOKEN_ID
        sync: false
      - key: FACILITATOR_FEE_PAYER_ID
        sync: false
      - key: ARC_PROVIDER_ADDRESS
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: ARC_PROVIDER_ADDRESS
      - key: ARC_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: CARDANO_PREPROD_PROVIDER_ADDRESS
        sync: false
      - key: CARDANO_PREPROD_USDCX_ASSET_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_USDCX_ASSET_ID
      - key: CARDANO_USDCX_RESOURCE_PRICE_ATOMIC
        value: "1000000"

  - type: web
    name: agentpay-dashboard
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: bash scripts/render/build-dashboard.sh
    preDeployCommand: bash scripts/render/predeploy-dashboard.sh
    startCommand: bash scripts/render/start-dashboard.sh
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production
      - key: RENDER_DASHBOARD_ORIGIN
        fromService:
          type: web
          name: agentpay-dashboard
          envVarKey: RENDER_EXTERNAL_URL
      - key: AGENTPAY_FACILITATOR_ORIGIN
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # Must be exactly 32 random bytes encoded as 43-char unpadded base64url.
      # Do not use Render generateValue for this key because its encoding shape
      # is not the dashboard's encryption-key contract.
      - key: KEY_ENCRYPTION_MASTER_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: HEDERA_PAYER_ACCOUNT_ID
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: HEDERA_PAYER_ID
      - key: HEDERA_PROVIDER_ACCOUNT_ID
        fromService:
          type: web
          name: agentpay-resource-server
          envVarKey: PROVIDER_ACCOUNT_ID
      - key: HEDERA_USDC_TOKEN_ID
        fromService:
          type: web
          name: agentpay-resource-server
          envVarKey: USDC_TOKEN_ID
      - key: FACILITATOR_SIGNING_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: HEDERA_MANAGED_SIGNING_API_KEY
      - key: FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: HEDERA_SETTLEMENT_API_KEY
      - key: FACILITATOR_CONTRACT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: HEDERA_CONTRACT_EXECUTION_API_KEY
      - key: ARC_FACILITATOR_SIGNING_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: ARC_MANAGED_SIGNING_API_KEY
      - key: ARC_FACILITATOR_CONTRACT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: ARC_CONTRACT_EXECUTION_API_KEY
      - key: ARC_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_PROVIDER_ADDRESS
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: ARC_PROVIDER_ADDRESS
      - key: ARC_PAYER_ADDRESS
        sync: false
      - key: CARDANO_PREPROD_FACILITATOR_SIGNING_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: CARDANO_MANAGED_SIGNING_API_KEY
      - key: CARDANO_PREPROD_FACILITATOR_SETTLEMENT_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: CARDANO_SETTLEMENT_API_KEY
      - key: CARDANO_PREPROD_PAYER_ADDRESS
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_PAYER_ADDRESS
      - key: CARDANO_PREPROD_PROVIDER_ADDRESS
        fromService:
          type: web
          name: agentpay-resource-server
          envVarKey: CARDANO_PREPROD_PROVIDER_ADDRESS
      - key: CARDANO_PREPROD_BLOCKFROST_URL
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_BLOCKFROST_URL
      - key: CARDANO_PREPROD_BLOCKFROST_PROJECT_ID
        fromService:
          type: web
          name: agentpay-cardano-signer-preprod
          envVarKey: CARDANO_BLOCKFROST_PROJECT_ID
      - key: CARDANO_SETTLEMENT_STORE_API_KEY
        fromService:
          type: web
          name: agentpay-facilitator
          envVarKey: CARDANO_SETTLEMENT_STORE_API_KEY
      - key: X402_NETWORK
        value: hedera:testnet
      - key: NOTIFICATION_FROM_EMAIL
        value: notifications@agentpay.dev
      - key: VIRTUAL_CARDS_ENABLED
        value: "false"
      - key: CARD_PROVIDER
        value: SANDBOX
      - key: CATALYST_PRODUCTION_ENABLED
        value: "false"
