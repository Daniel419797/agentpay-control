# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# AgentPay production topology intentionally has exactly two Render services:
#   1. agentpay-facilitator     - public multi-rail protocol boundary
#   2. agentpay-cardano-signer  - isolated Cardano transaction/signing boundary
#
# The Next.js dashboard/API is deployed only on Vercel. PostgreSQL/Supabase and
# external paid resource servers are external dependencies, not Blueprint services.
previews:
  generation: off

services:
  - type: web
    name: agentpay-cardano-signer
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: cardano-signer/Dockerfile.unified
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production

      # Preprod managed agents get isolated deterministic keys derived only
      # inside this signer service. Never copy this secret to Vercel/facilitator.
      - key: CARDANO_PREPROD_MANAGED_AGENT_MASTER_KEY
        sync: false

      # Mainnet managed agents never use a deployment-wide derivation secret.
      # The external custody adapter must resolve a distinct Ed25519 identity per
      # immutable Agent ID and sign only the supplied transaction-body hash.
      - key: CARDANO_MAINNET_AGENT_CUSTODY_URL
        sync: false
      - key: CARDANO_MAINNET_AGENT_CUSTODY_API_KEY
        sync: false

      # Network-specific Blockfrost credentials. The two project IDs must be
      # created for the matching Blockfrost networks and must not be reused.
      - key: CARDANO_PREPROD_BLOCKFROST_URL
        value: https://cardano-preprod.blockfrost.io/api/v0
      - key: CARDANO_PREPROD_BLOCKFROST_PROJECT_ID
        sync: false
      - key: CARDANO_MAINNET_BLOCKFROST_URL
        value: https://cardano-mainnet.blockfrost.io/api/v0
      - key: CARDANO_MAINNET_BLOCKFROST_PROJECT_ID
        sync: false

      # Circle xReserve USDCx Cardano native-asset identities. These are public
      # identifiers, not credentials. Mainnet never receives a managed master key.
      - key: CARDANO_PREPROD_USDCX_ASSET_ID
        value: 31dde3db98ad05feb688d4dbb146b3b6054e1246cbcef98c79b0bf665553444378
      - key: CARDANO_MAINNET_USDCX_ASSET_ID
        value: 1f3aec8bfe7ea4fe14c5f121e2a92e301afe414147860d557cac7e345553444378

      # Separate internal capabilities prevent one compromised network client
      # credential from authorizing signer calls on the other Cardano network.
      - key: CARDANO_PREPROD_SIGNER_API_KEY
        generateValue: true
      - key: CARDANO_MAINNET_SIGNER_API_KEY
        generateValue: true

      - key: CARDANO_MIN_OUTPUT_LOVELACE
        value: "1000000"
      - key: CARDANO_TOKEN_OUTPUT_LOVELACE
        value: "2000000"
      - key: CARDANO_MIN_CHANGE_LOVELACE
        value: "2000000"
      - key: CARDANO_MAX_INPUTS
        value: "20"

  - type: web
    name: agentpay-facilitator
    runtime: docker
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: facilitator-combined/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: NODE_ENV
        value: production

      # ------------------------- Hedera Testnet -------------------------
      - key: HEDERA_TESTNET_OPERATOR_ID
        sync: false
      - key: HEDERA_TESTNET_OPERATOR_KEY
        sync: false
      - key: HEDERA_TESTNET_OPERATOR_KEY_TYPE
        sync: false
      - key: HEDERA_TESTNET_PAYER_ID
        sync: false
      - key: HEDERA_TESTNET_PAYER_KEY
        sync: false
      - key: HEDERA_TESTNET_PAYER_KEY_TYPE
        sync: false
      - key: HEDERA_TESTNET_MANAGED_AGENT_MASTER_KEY
        sync: false
      - key: HEDERA_TESTNET_MANAGED_AGENT_INITIAL_TINYBAR
        value: "0"
      - key: HEDERA_TESTNET_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: HEDERA_TESTNET_SETTLEMENT_API_KEY
        generateValue: true
      - key: HEDERA_TESTNET_CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: HEDERA_TESTNET_CONTRACT_ALLOWLIST_JSON
        value: "[]"

      # -------------------------- Hedera Mainnet ------------------------
      # Mainnet has separate operator/payer credentials. No deterministic
      # managed-agent master key is accepted on mainnet; agents are self-custody.
      - key: HEDERA_MAINNET_OPERATOR_ID
        sync: false
      - key: HEDERA_MAINNET_OPERATOR_KEY
        sync: false
      - key: HEDERA_MAINNET_OPERATOR_KEY_TYPE
        sync: false
      - key: HEDERA_MAINNET_PAYER_ID
        sync: false
      - key: HEDERA_MAINNET_PAYER_KEY
        sync: false
      - key: HEDERA_MAINNET_PAYER_KEY_TYPE
        sync: false
      # Kept as a distinct internal capability because the Hedera child app has
      # one capability schema for both networks. Managed-agent endpoints still
      # reject mainnet before signing.
      - key: HEDERA_MAINNET_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: HEDERA_MAINNET_SETTLEMENT_API_KEY
        generateValue: true
      - key: HEDERA_MAINNET_CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: HEDERA_MAINNET_CONTRACT_ALLOWLIST_JSON
        value: "[]"

      # ---------------------------- Arc Testnet -------------------------
      # Arc public mainnet is intentionally not enabled before Circle's public
      # mainnet launch. Testnet identities remain isolated per agent.
      - key: ARC_TESTNET_PAYER_PRIVATE_KEY
        sync: false
      - key: ARC_TESTNET_RELAYER_PRIVATE_KEY
        sync: false
      - key: ARC_TESTNET_CONTRACT_EXECUTION_PRIVATE_KEY
        sync: false
      - key: ARC_TESTNET_MANAGED_AGENT_MASTER_KEY
        sync: false
      - key: ARC_TESTNET_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: ARC_TESTNET_USDC_ADDRESS
        value: "0x3600000000000000000000000000000000000000"
      - key: ARC_TESTNET_PROVIDER_ADDRESS
        sync: false
      - key: ARC_TESTNET_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: ARC_TESTNET_SETTLEMENT_API_KEY
        generateValue: true
      - key: ARC_TESTNET_CONTRACT_EXECUTION_API_KEY
        generateValue: true
      - key: ARC_TESTNET_CONTRACT_ALLOWLIST_JSON
        value: "[]"

      # ------------------------ Cardano shared routing ------------------
      - key: CARDANO_SIGNER_ORIGIN
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: RENDER_EXTERNAL_URL
      - key: CARDANO_PREPROD_SIGNER_API_KEY
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_PREPROD_SIGNER_API_KEY
      - key: CARDANO_MAINNET_SIGNER_API_KEY
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_MAINNET_SIGNER_API_KEY
      - key: CARDANO_PREPROD_BLOCKFROST_URL
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_PREPROD_BLOCKFROST_URL
      - key: CARDANO_PREPROD_BLOCKFROST_PROJECT_ID
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_PREPROD_BLOCKFROST_PROJECT_ID
      - key: CARDANO_MAINNET_BLOCKFROST_URL
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_MAINNET_BLOCKFROST_URL
      - key: CARDANO_MAINNET_BLOCKFROST_PROJECT_ID
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_MAINNET_BLOCKFROST_PROJECT_ID
      - key: CARDANO_PREPROD_USDCX_ASSET_ID
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_PREPROD_USDCX_ASSET_ID
      - key: CARDANO_MAINNET_USDCX_ASSET_ID
        fromService:
          type: web
          name: agentpay-cardano-signer
          envVarKey: CARDANO_MAINNET_USDCX_ASSET_ID

      # Dashboard durable replay/settlement-claim endpoint. Use the Vercel
      # production origin, e.g. https://agentpay-zeta.vercel.app/api/v1/internal/cardano-settlement-claims
      - key: CARDANO_SETTLEMENT_STORE_URL
        sync: false
      - key: CARDANO_SETTLEMENT_STORE_API_KEY
        generateValue: true

      - key: CARDANO_PREPROD_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: CARDANO_PREPROD_SETTLEMENT_API_KEY
        generateValue: true
      # Mainnet capability authorizes transaction preparation and the isolated
      # per-agent managed routes. It is not a payer key or custody credential.
      - key: CARDANO_MAINNET_MANAGED_SIGNING_API_KEY
        generateValue: true
      - key: CARDANO_MAINNET_SETTLEMENT_API_KEY
        generateValue: true

      - key: CARDANO_MAX_FEE_LOVELACE
        value: "1000000"
      - key: CARDANO_CONFIRMATION_TIMEOUT_MS
        value: "120000"
      - key: CARDANO_CONFIRMATION_POLL_MS
        value: "3000"